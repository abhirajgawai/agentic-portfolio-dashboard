[project]
name = "portfolio"
version = "0.1.0"
description = "Agentic portfolio dashboard pipeline - deterministic MCP-based snapshotting (M0-M6)"
readme = "PLAN.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
    "typer>=0.12",
    "moomoo-api>=10.9.6908",
    "casparser>=1.3.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
portfolio = "portfolio.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv]
package = true
# Keep the venv inside the repo (gitignored) - predictable on Windows.
# default: .venv

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "moomoo_mcp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
